/* ============================================================
   SIGHTLINE — playable ad. Single file, zero external requests.
   Visual DNA lifted from the shipping game: white tiles with 3px
   inset black borders on a black board silhouette, Sora-weight
   clue numerals at tile edges, revealPop reveal, electric-red
   bomb with the black dot, Yumloop electric blue surround.
   ============================================================ */
:root{
  --blue:#140FD7;
  --board-bg:#f3f0e8;
  --safe:#f4f0e6;
  --mine:#ff2e2e;
  --ink:#1a1a1a;
  --beam:#3d6aff;
  --n0:#8a8577; --n1:#000000; --n2:#0eb14a; --n3:#7d2bd6; --n4:#ff9500; --n5:#e60000;
  --bw:3px;
  --display:'Avenir Next','Avenir',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --num:'SoraDigits','Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@font-face{
  font-family:'SoraDigits';
  src:url(data:font/woff2;base64,d09GMgABAAAAAAHwAA4AAAAABDgAAAGcAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGyAcKgZgP1NUQVQqAAQRCAoBKgE2AiQDBAsEAAQgBYNAByAbZwMALgpsY+rQRZBleNGyZUGumb+cN0IlJ6iWrWd2CSkoNPWakNwrhAnJobLwIDxGodAoymdhEAb7d7W2fTxRITEXEW/mybS+6XGGtEJqFomRIQDyv5kzSYy9/3a+FlAiPSqxCBP7epdggn/QwOIu8IHMAt0AaOI0kG0e3sJQWRmFei7Qb1GGdDCd7SChQgNwGGuyQmvJK5kHkDbvQc2ngkTJxzwBaNd74wjqsQNQz/E3gI/V1fLeWX2LPoCAnM4fVoWF0CswScKi0INpcQlSQPSUVQBCNEZAgARSPSiQZHv8PB7Z+O8t5Q+/1bwC8NuT+nCn+qsv6JYgeLnvGjaQUcBrolzCXkK4iDmMCwBQJPpch0Xtw7MewqIHpGGvULR8++pBl3l/2m0xJrlgMNZ/ZvQYjw0jfL5T27Q4UldV04DsLB3ZYiojK4odXeXIQHALU4ZkWZyfWVNFhWlzSyhlKvYrGKZyyQ3TKTbmgOd2x8mNx8kQe9pGN4Un07qyKq9aFsvFpHWHqIQPkTJ7Y4cy/yQ6ut9KGSEMsqYWAA==) format('woff2');
  font-weight:800; font-style:normal; font-display:swap;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
body{
  background:var(--blue);
  font-family:var(--display);
  color:#fff;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px)
          calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px);
}
#stage{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.6vmin,22px);
  width:100%;height:100%;max-width:560px;
}
/* landscape: copy left, board right */
@media (orientation:landscape) and (max-height:520px){
  #stage{flex-direction:row;max-width:none;gap:clamp(16px,4vw,48px);}
  #copy{text-align:left;align-items:flex-start;max-width:42vw;}
  #copy .sub{margin-left:0;}
  #mark{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);}
}
#copy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1.4vmin,12px);}
.head{
  font-weight:600;
  font-size:clamp(17px,4.6vmin,26px);
  letter-spacing:.30em;text-indent:.30em;line-height:1.35;
  text-transform:uppercase;margin:0;
  animation:fadeDown .5s cubic-bezier(.22,.61,.36,1) both;
}
.sub{
  font-weight:500;font-size:clamp(12px,3vmin,15.5px);letter-spacing:.02em;
  color:rgba(255,255,255,.85);margin:0;line-height:1.45;
  animation:fadeDown .5s cubic-bezier(.22,.61,.36,1) .12s both;
}
.stat{
  font-weight:700;font-size:clamp(12px,3vmin,15px);letter-spacing:.14em;text-transform:uppercase;
  color:#BFA6FD;margin:0;display:none;
}
.stat.on{display:block;}
@keyframes fadeDown{0%{opacity:0;transform:translateY(-8px);}100%{opacity:1;transform:none;}}

/* --- board --- */
#boardwrap{position:relative;animation:fadeUp .5s cubic-bezier(.22,.61,.36,1) .18s both;}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:none;}}
#board{
  position:relative;
  background:#000;
  padding:var(--bw);
  display:grid;
  grid-template-columns:repeat(5,var(--cell));
  grid-template-rows:repeat(5,var(--cell));
  box-shadow:0 10px 32px rgba(0,0,0,.35);
}
.cell{
  position:relative;width:var(--cell);height:var(--cell);
  background:#fff;
  box-shadow:inset 0 0 0 var(--bw) #000;
  cursor:pointer;
  transition:background .14s;
}
.cell:active{background:#ede8da;box-shadow:inset 0 0 0 var(--bw) #000, inset 0 4px 10px rgba(0,0,0,.16);}
.cell.safe{background:var(--safe);cursor:default;}
.cell.safe:active{background:var(--safe);box-shadow:inset 0 0 0 var(--bw) #000;}
.cell.justrevealed{animation:revealPop .38s cubic-bezier(.22,.61,.36,1);}
@keyframes revealPop{
  0%{transform:scale(1);opacity:0;}
  55%{transform:scale(1.07);opacity:1;}
  100%{transform:scale(1);opacity:1;}
}
.cell.mine{background:var(--mine);cursor:default;animation:mineReveal .45s cubic-bezier(.22,.61,.36,1);}
.cell.mine::after{content:"";position:absolute;inset:28%;background:#000;border-radius:50%;}
.cell.mine:active{background:var(--mine);box-shadow:inset 0 0 0 var(--bw) #000;}
.cell.flagged-final{background:#ffd6a8;}
.cell.flagged-final::after{content:"";position:absolute;inset:30%;border-radius:50%;
  border:3px solid #c8442a;background:transparent;}
.cell.beamlit{background:var(--beam)!important;
  box-shadow:inset 0 0 0 var(--bw) #000, 0 0 16px rgba(0,64,247,.45)!important;}
.cell.beamlit .clue span{color:#fff!important;}
/* first-move pulse — mirrors the game's clue-tap nudge */
.cell.nudge{animation:nudge 1.5s ease-in-out infinite;}
@keyframes nudge{
  0%,100%{box-shadow:inset 0 0 0 var(--bw) #000;}
  50%{box-shadow:inset 0 0 0 var(--bw) #000, inset 0 0 0 7px rgba(61,106,255,.5);}
}
.clue{position:absolute;inset:0;font-weight:800;font-family:var(--num);pointer-events:none;
  font-size:calc(var(--cell) * .30);color:var(--ink);}
.clue span{position:absolute;line-height:1;}
.clue .u{top:7%;left:50%;transform:translateX(-50%);}
.clue .d{bottom:7%;left:50%;transform:translateX(-50%);}
.clue .l{left:9%;top:50%;transform:translateY(-50%);}
.clue .r{right:9%;top:50%;transform:translateY(-50%);}
.clue .n0{color:var(--n0);} .clue .n1{color:var(--n1);} .clue .n2{color:var(--n2);}
.clue .n3{color:var(--n3);} .clue .n4{color:var(--n4);} .clue .n5{color:var(--n5);}
.clue span.cluepulse{animation:cluePulse .8s cubic-bezier(.22,.61,.36,1);}
@keyframes cluePulse{0%{transform-origin:center;}35%{filter:brightness(1.1);}
  0%,100%{scale:1;}40%{scale:1.7;}}
/* shake on bomb */
#board.shake{animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}40%{transform:translateX(6px);}
  60%{transform:translateX(-4px);}80%{transform:translateX(3px);}
}

/* --- toast --- */
#toast{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;
  transform:translateX(-50%) translateY(-90px);
  background:#fff;color:var(--ink);
  font-weight:600;font-size:14px;letter-spacing:.01em;
  padding:11px 20px;border:3px solid #000;
  transition:transform .32s cubic-bezier(.22,.61,.36,1);
  white-space:nowrap;z-index:40;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* --- footer mark --- */
#mark{
  font-weight:400;font-size:clamp(11px,2.6vmin,14px);
  letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.66);
  animation:fadeUp .5s cubic-bezier(.22,.61,.36,1) .3s both;
}

/* --- result --- */
#result{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,60,0);
  pointer-events:none;visibility:hidden;
  transition:background .45s ease;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
}
#result.show{background:rgba(10,8,60,.72);pointer-events:auto;visibility:visible;}
#card{
  background:#fff;color:var(--ink);
  border:var(--bw) solid #000;
  padding:clamp(24px,6vmin,40px) clamp(26px,7vmin,48px);
  text-align:center;max-width:min(86vw,380px);width:100%;
  transform:translateY(24px) scale(.97);opacity:0;
  transition:transform .45s cubic-bezier(.22,.61,.36,1) .1s, opacity .4s ease .1s;
  box-shadow:0 18px 48px rgba(0,0,0,.4);
}
#result.show #card{transform:none;opacity:1;}
#card .passed{
  font-weight:600;font-size:clamp(20px,5.6vmin,28px);
  letter-spacing:.30em;text-indent:.30em;text-transform:uppercase;margin:0 0 14px;
}
#card .grade{
  font-family:var(--num);font-weight:800;
  font-size:clamp(15px,4vmin,19px);letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px;
}
#card .grade.flawless{color:var(--n2);}
#card .grade.mistakes{color:var(--n4);}
#card .time{
  font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(26px,7vmin,36px);margin:0 0 20px;letter-spacing:.04em;
}
#card .cstat{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--blue);margin:0 0 14px;display:none;}
#card .cstat.on{display:block;}
#cta{
  display:block;width:100%;
  background:#000;color:#fff;border:none;cursor:pointer;
  font-family:var(--display);font-weight:700;
  font-size:clamp(16px,4.4vmin,19px);letter-spacing:.12em;text-transform:uppercase;
  padding:17px 10px;margin:0 0 12px;
  transition:transform .12s;
}
#cta:active{transform:scale(.97);}
#card .ctasub{font-weight:500;font-size:13px;color:#666;margin:0;letter-spacing:.02em;}
</style>
</head>

    <p class="grade" id="grade"></p>

    <button id="cta"></button>
    <p class="ctasub" id="ctasub"></p>

      text-transform:uppercase;color:var(--blue);margin-top:14px;padding:8px;">Share the test</button>
  </div>
</div>

var PlayableAnalytics = (function(){

      // mraid.open(); it exposes no custom-event ingestion API for playables,
      // so events stay internal. Kept as a seam in case one appears.
      if (CFG.analyticsMode === 'dev') adapters.dev(ev, data);

function whenReady(fn){

  else m.addEventListener('ready', onReady);

      ctx = new (window.AudioContext||window.webkitAudioContext)();

/* ============================================================
   GAME — one bespoke, deduction-proven puzzle (see
   marketing/playable/tools/verify_puzzle.js). Bomb taps never
   end the run; they cost Flawless and the player continues.
   ============================================================ */
var N = PUZZLE.size;
var DIRS = { R:[0,1], L:[0,-1], D:[1,0], U:[-1,0] };
var DIRCLS = { R:'r', L:'l', D:'d', U:'u' };
var bombSet = {};
PUZZLE.bombs.forEach(function(b){ bombSet[b[0]+','+b[1]] = true; });
var revealed = {}, mistakes = 0, taps = 0, started = false, startAt = 0, done = false;
var safeTotal = N*N - PUZZLE.bombs.length;
var safeCount = 0;
var board = document.getElementById('board');
var cells = {};

function sizeBoard(){
  var pad = 24;
  var stage = document.getElementById('stage');
  var avail = Math.min(window.innerWidth - pad, 440);
  var copyH = document.getElementById('copy').offsetHeight + document.getElementById('mark').offsetHeight;
  var isLand = window.innerWidth > window.innerHeight && window.innerHeight < 520;
  var availH = isLand ? window.innerHeight - pad : window.innerHeight - copyH - 80;
  if (isLand) avail = Math.min(window.innerWidth * .52, 440);
  var side = Math.max(180, Math.min(avail, availH));
  document.documentElement.style.setProperty('--cell', Math.floor(side/N) + 'px');
}
window.addEventListener('resize', sizeBoard);
window.addEventListener('orientationchange', function(){ setTimeout(sizeBoard, 120); });

function clueHtml(r, c){
  var list = PUZZLE.clues[r+','+c];
  if (!list) return '';
  var h = '<div class="clue">';
  list.forEach(function(cl){
    var ncls = 'n' + Math.min(cl.n, 5);
    h += '<span class="'+DIRCLS[cl.dir]+' '+ncls+'" data-dir="'+cl.dir+'">'+cl.n+'</span>';
  });
  return h + '</div>';
}

function buildBoard(){
  for (var r=0;r<N;r++) for (var c=0;c<N;c++){
    var el = document.createElement('div');
    el.className = 'cell';
    el.dataset.r = r; el.dataset.c = c;
    board.appendChild(el);
    cells[r+','+c] = el;
  }
  PUZZLE.preRevealed.forEach(function(p){ revealCell(p[0], p[1], true); });
  var hint = PUZZLE.firstHint;
  if (hint) cells[hint.cell[0]+','+hint.cell[1]].classList.add('nudge');
}

function revealCell(r, c, silent){
  var k = r+','+c, el = cells[k];
  if (revealed[k]) return;
  revealed[k] = true;
  el.classList.remove('nudge');
  el.classList.add('safe');
  el.innerHTML = clueHtml(r, c);
  if (!silent){
    el.classList.add('justrevealed');
    setTimeout(function(){ el.classList.remove('justrevealed'); }, 400);
    Sound.pop();
  }
  safeCount++;
}

/* Trace a clue's line of sight — the wordless "this is how numbers work"
   beat after the very first reveal. Beam-lights the ray cell by cell,
   pulses the numeral, then fades. Pure visuals, no modal. */
function traceClue(clueR, clueC, dir){
  var el = cells[clueR+','+clueC];
  var span = el.querySelector('.clue span[data-dir="'+dir+'"]');
  if (span){ span.classList.add('cluepulse'); setTimeout(function(){ span.classList.remove('cluepulse'); }, 850); }
  var d = DIRS[dir], lit = [];
  var seq = [];
  for (var rr=clueR+d[0], cc=clueC+d[1]; rr>=0&&rr<N&&cc>=0&&cc<N; rr+=d[0], cc+=d[1]) seq.push(rr+','+cc);
  seq.forEach(function(k, i){
    setTimeout(function(){ cells[k].classList.add('beamlit'); lit.push(k); }, 140 + i*110);
  });
  setTimeout(function(){ lit.forEach(function(k){ cells[k].classList.remove('beamlit'); }); }, 140 + seq.length*110 + 650);
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

function fmtTime(ms){
  var s = Math.max(0, Math.round(ms/1000));
  return Math.floor(s/60) + ':' + ('0'+(s%60)).slice(-2);
}

function onTap(ev){
  if (done) return;
  var el = ev.target.closest ? ev.target.closest('.cell') : null;
  if (!el) return;
  var r = +el.dataset.r, c = +el.dataset.c, k = r+','+c;
  Sound.unlock();
  if (!started){
    started = true;
    startAt = Date.now();
    PlayableAnalytics.run.start = startAt;
    PlayableAnalytics.event('first_tile_tapped', null, true);
  }
  if (revealed[k] || el.classList.contains('mine')) return;
  taps++;
  PlayableAnalytics.run.taps = taps;
  if (taps === 3) PlayableAnalytics.event('third_tile_reached', null, true);
  if (bombSet[k]){
    mistakes++;
    PlayableAnalytics.run.mistakes = mistakes;
    PlayableAnalytics.event('bomb_hit', { mistakes: mistakes });
    el.classList.add('mine');
    Sound.bomb();
    board.classList.add('shake');
    setTimeout(function(){ board.classList.remove('shake'); }, 450);
    if (navigator.vibrate) { try{ navigator.vibrate(60); }catch(_){} }
    toast(CFG.bombToast);
    return; /* bombs never end the playable */
  }
  revealCell(r, c);
  if (taps === 1 && PUZZLE.firstHint){
    var fc = PUZZLE.firstHint.clueCell;
    var firstClue = (PUZZLE.clues[fc[0]+','+fc[1]]||[])[0];
    if (firstClue) setTimeout(function(){ traceClue(fc[0], fc[1], firstClue.dir); }, 220);
  }
  if (safeCount >= safeTotal) finish();
}

function finish(){
  done = true;
  var elapsed = Date.now() - startAt;
  PlayableAnalytics.run.completed = true;
  PlayableAnalytics.run.flawless = mistakes === 0;
  PlayableAnalytics.run.elapsed = elapsed;
  PlayableAnalytics.event('puzzle_completed', { elapsed: elapsed, mistakes: mistakes });
  if (!mistakes) PlayableAnalytics.event('puzzle_completed_flawless', { elapsed: elapsed });
  /* flag the bombs the player deduced around — closing beat */
  PUZZLE.bombs.forEach(function(b, i){
    setTimeout(function(){
      var el = cells[b[0]+','+b[1]];
      if (!el.classList.contains('mine')) el.classList.add('flagged-final');
    }, 220 + i*140);
  });
  if (mistakes === 0) Sound.flawless(); else Sound.win();
  var grade = document.getElementById('grade');
  if (mistakes === 0){ grade.textContent = 'Flawless'; grade.classList.add('flawless'); }
  else { grade.textContent = mistakes + (mistakes === 1 ? ' mistake' : ' mistakes'); grade.classList.add('mistakes'); }
  document.getElementById('time').textContent = fmtTime(elapsed);
  setTimeout(function(){ document.getElementById('result').classList.add('show'); }, 900);
}

/* ============================================================
   CTA — the only path to the store. Result screen only; board
   taps can never trigger it. mraid.open where available,
   window.open fallback for web/dev.
   ============================================================ */
function openStore(){
  PlayableAnalytics.event('cta_clicked', { url: CFG.appStoreUrl });
  var url = CFG.appStoreUrl;
  if (!url){ PlayableAnalytics.event('cta_missing_url'); return; }
  if (CFG.network === 'web' && SRC && SRC !== 'direct'){
    // Apple campaign token — inert without a provider token, future-proof with one.
    url += (url.indexOf('?') < 0 ? '?' : '&') + 'ct=' + encodeURIComponent(SRC);
  }
  var m = window.mraid;
  if (CFG.useMraid && m && m.open){ try{ m.open(url); return; }catch(_){} }
  try { window.open(url, '_blank'); } catch(_){ location.href = url; }
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  document.getElementById('headline').innerHTML = CFG.headline;
  document.getElementById('subtitle').innerHTML = CFG.subtitle;
  document.getElementById('cta').textContent = CFG.ctaText;
  document.getElementById('ctasub').textContent = CFG.ctaSub;
  if (CFG.displayPassStatistic && CFG.passStatistic != null){
    var s = document.getElementById('statline');
    s.textContent = CFG.statTemplate.replace('{n}', CFG.passStatistic);
    s.classList.add('on');
    var cs = document.getElementById('cardstat');
    cs.textContent = CFG.statTemplate.replace('{n}', CFG.passStatistic);
    cs.classList.add('on');
  }
  buildBoard();
  sizeBoard();
  requestAnimationFrame(sizeBoard);
  board.addEventListener('pointerdown', onTap);
  document.getElementById('cta').addEventListener('click', openStore);
  if (CFG.network === 'web'){
    var sh = document.getElementById('share');
    if (navigator.share || (navigator.clipboard && navigator.clipboard.writeText)){
      sh.style.display = 'block';
      sh.addEventListener('click', function(){
        PlayableAnalytics.event('share_clicked');
        var shareUrl = 'https://yumloop.net/sightline-test/';
        if (navigator.share){
          navigator.share({ title: 'The Sightline Test',
            text: 'Can you pass the Sightline Test? No guessing. Just logic.',
            url: shareUrl }).catch(function(){});
        } else {
          navigator.clipboard.writeText(shareUrl).then(function(){
            sh.textContent = 'Link copied';
            setTimeout(function(){ sh.textContent = 'Share the test'; }, 1600);
          }).catch(function(){});
        }
      });
    }
  }
  whenReady(function(){
    PlayableAnalytics.event('playable_loaded', { network: CFG.network }, true);
  });
})();
</script>
