<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#140FD7;
    color:#fff;
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(24px,6vw,64px);
    -webkit-font-smoothing:antialiased;
  }
  img{width:min(620px,78vw); height:auto; display:block}
  p{
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(11px,1.5vw,13px); font-weight:500;
    letter-spacing:.24em; text-transform:uppercase;
    color:rgba(255,255,255,.78);
    margin:clamp(26px,4vw,40px) 0 clamp(44px,6vw,64px);
  }
  a{
    display:inline-block; text-decoration:none;
    background:#fff; color:#140FD7; border:1px solid #fff;
    font-weight:600; font-size:15.5px; letter-spacing:.01em;
    padding:15px 34px;
    transition:background .15s linear, color .15s linear;
  }
  a:hover,a:focus-visible{background:transparent; color:#fff}
  a:focus-visible{outline:2px solid #fff; outline-offset:4px}
</style>
