<style>
  :root{
    --blue:#140FD7;
    --lilac:#BFA6FD;
    --sans:Archivo,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100svh;
    background:var(--blue); color:#fff;
    font-family:var(--sans);
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; height:auto; display:block}
  :focus-visible{outline:2px solid #fff; outline-offset:4px}

  /* --- top bar: studio mark on the left, the two actions on the right --- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:clamp(16px,2.6vw,26px) clamp(20px,5vw,64px) 0;
  }
  .brand-link{display:block; line-height:0}
  .brand{width:clamp(72px,8vw,104px)}
  .topnav{display:flex; flex-shrink:0}
  .topnav a{
    display:inline-block; text-decoration:none; white-space:nowrap;
    font-weight:600; font-size:clamp(13px,1.2vw,15px); letter-spacing:.01em;
    padding:clamp(10px,1.1vw,13px) clamp(16px,1.9vw,26px); border:1px solid #fff;
    transition:background .15s linear, color .15s linear;
  }
  .topnav a.solid{background:#fff; color:var(--blue); border-left:0}
  .topnav a.solid:hover{background:transparent; color:#fff; border-left:1px solid #fff}
  .topnav a.line{background:transparent; color:#fff}
  .topnav a.line:hover{background:#fff; color:var(--blue)}

  .stage{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(24px,4vw,56px) clamp(20px,5vw,64px) clamp(24px,4vw,48px);
  }

  /* --- Sightline block --- */
  .game{
    display:grid; grid-template-columns:auto auto;
    align-items:center; justify-content:center;
    gap:clamp(30px,5vw,76px);
    width:100%;
  }
  .copy{text-align:left; max-width:440px}
  /* The game's own menu heading, verbatim: Avenir Next, weight 400,
     .42em letterspacing, uppercase, indent to optically centre the tracking. */
  .mark-heading{
    font-family:'Avenir Next','Avenir',Archivo,-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:1;
    letter-spacing:.42em; text-indent:.42em; text-transform:uppercase;
    color:#fff; margin:0;
  }
  .rule{height:1px; background:rgba(255,255,255,.38); border:0; margin:clamp(18px,2.4vw,30px) 0}
  .soon{
    margin:0; font-weight:600; text-transform:uppercase;
    font-size:clamp(16px,2vw,27px); letter-spacing:.15em; line-height:1.32;
  }
  .soon span{color:var(--lilac); text-transform:none}
  .board{width:clamp(240px,30vw,380px)}

  @media (max-width:860px){
    .game{grid-template-columns:1fr; justify-items:center; gap:clamp(28px,6vw,44px)}
    .copy{text-align:center; max-width:none}
    .mark-heading{font-size:clamp(26px,7.6vw,38px)}
    .board{width:min(290px,62vw)}
  }
  /* narrow phones: the bar keeps its shape (mark left, actions right), just tighter */
  @media (max-width:430px){
    .topbar{gap:12px; padding-top:14px}
    .brand{width:60px}
    .topnav a{font-size:12.5px; padding:9px 13px; letter-spacing:0}
  }

  .more{
    margin:clamp(34px,5vw,56px) 0 0;
    font-family:var(--mono); font-size:clamp(10px,1.1vw,12px); font-weight:500;
    letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.55);
  }

  /* --- footer --- */
  .foot{
    display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
    padding:0 clamp(20px,5vw,64px) 26px;
  }
  .foot a{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.5); text-decoration:none;
  }
  .foot a:hover,.foot a:focus-visible{color:#fff}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand-link" href="/" aria-label="Yumloop home">
    <img class="brand" src="yumloop-logo.png?v=3" alt="Yumloop" width="760" height="892">
  </a>
  <nav class="topnav" aria-label="Contact">
    <a class="line" href="mailto:yoni@yumloop.net?subject=Hello%20Yumloop">Contact</a>
    <a class="solid" href="mailto:yoni@yumloop.net?subject=Launch%20note&amp;body=Let%20me%20know%20when%20Sightline%20is%20out.">Launch note</a>
  </nav>
</header>

<main class="stage">
  <section class="game" aria-label="Sightline">
    <div class="copy">
      <h1 class="mark-heading">Sightline</h1>
      <hr class="rule">
      <p class="soon">Coming soon to <span>iOS</span>, <span>Google&nbsp;Play</span> &amp;&nbsp;<span>Steam</span></p>
    </div>
    <img class="board" src="sightline-board.png"
         alt="A Sightline puzzle board: a four-by-four grid with numbered clues down the left edge and coloured tiles marking blockers and directions."
         width="840" height="868">
  </section>

  <p class="more">And more games coming soon</p>
</main>

<nav class="foot" aria-label="Site">
  <a href="/privacy.html">Privacy</a>
  <a href="/support.html">Support</a>
  <a href="/sightline-press.html">Press</a>
</nav>


<!-- Falling Sightline tiles: real game tiles (exact colours, borders, Sora
     clue numerals) drop from the top with gravity, bounce off any text or
     image they hit (which flinches in response), spin a little, and exit off
     the bottom of the page. Decorative only: pointer-events none, skipped
     entirely under prefers-reduced-motion. -->
<style>
  .fx-tile{position:fixed; top:0; left:0; z-index:5; pointer-events:none;
    width:46px; height:46px; background:#fff;
    box-shadow:inset 0 0 0 3px #000; border-radius:0;
    will-change:transform; contain:layout style;}
  .fx-tile .clue{position:absolute; inset:0; font-family:Sora,var(--sans);
    font-weight:800; font-size:17px; color:#111; pointer-events:none;}
  .fx-tile .clue span{position:absolute; line-height:1;}
  .fx-tile .clue .r{right:10%; top:50%; transform:translateY(-50%);}
  .fx-tile .clue .d{bottom:8%; left:50%; transform:translateX(-50%);}
  .fx-tile.wall{background:repeating-linear-gradient(45deg,#000 0,#000 5px,#444 5px,#444 10px);}
  .fx-tile.chan{background:#0040f7;}
  .fx-tile.nbr{background:#a040d8;}
  .fx-tile.nbr .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:Sora,var(--sans);font-weight:800;font-size:19px;color:#fff;}
  .fx-tile.bomb{background:#ff2e2e;}
  .fx-tile.bomb::after{content:"";position:absolute;inset:31%;background:#000;border-radius:50%;}
  .fx-tile.chan svg{position:absolute;inset:0;width:100%;height:100%;
    fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;}
  .fx-bump{animation:fxBump .4s cubic-bezier(.22,.61,.36,1);}
  @keyframes fxBump{
    0%{transform:translateY(0);}
    35%{transform:translateY(5px);}
    65%{transform:translateY(-2px);}
    100%{transform:translateY(0);}
  }
</style>
<script>
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var KINDS=[
    function(el){ el.innerHTML='<div class="clue"><span class="r">1</span></div>'; },
    function(el){ el.innerHTML='<div class="clue"><span class="d">2</span></div>'; },
    function(el){ el.classList.add('wall'); },
    function(el){ el.classList.add('chan'); el.innerHTML='<svg viewBox="0 0 100 100"><line x1="28" y1="50" x2="72" y2="50"/><polyline points="36,40 28,50 36,60"/><polyline points="64,40 72,50 64,60"/></svg>'; },
    function(el){ el.classList.add('nbr'); el.innerHTML='<div class="n">1</div>'; },
    function(el){ el.classList.add('bomb'); },
    function(el){ /* plain hidden tile */ },
  ];
  var live=[], MAX=(innerWidth<640)?2:4, G=1900, REST=0.42;
  var colliders=[], colTs=0;
  function refreshColliders(){
    colliders=[];
    document.querySelectorAll('.brand,.mark-heading,.soon,.board,.more,.topnav a,.foot a').forEach(function(n){
      var r=n.getBoundingClientRect();
      if(r.width>4 && r.height>4) colliders.push({el:n, r:r});
    });
    colTs=performance.now();
  }
  function spawn(){
    if(live.length>=MAX) return;
    var el=document.createElement('div');
    el.className='fx-tile';
    KINDS[(Math.random()*KINDS.length)|0](el);
    var size=38+Math.random()*16;
    el.style.width=size+'px'; el.style.height=size+'px';
    document.body.appendChild(el);
    live.push({el:el, s:size,
      x:20+Math.random()*(innerWidth-40-size),
      y:-size-10, vx:(Math.random()-0.5)*60, vy:0,
      rot:(Math.random()-0.5)*20, vr:(Math.random()-0.5)*120,
      bounced:{}, last:performance.now()});
  }
  function frame(now){
    if(now-colTs>900) refreshColliders();
    for(var i=live.length-1;i>=0;i--){
      var t=live[i];
      var dt=Math.min(0.033,(now-t.last)/1000); t.last=now;
      t.vy+=G*dt; t.x+=t.vx*dt; t.y+=t.vy*dt; t.rot+=t.vr*dt;
      if(t.vy>0){
        for(var c=0;c<colliders.length;c++){
          var cc=colliders[c], r=cc.r;
          var bx=t.x, by=t.y+t.s;
          if(by>=r.top && by<=r.top+Math.max(14,t.vy*dt+8) &&
             bx+t.s>r.left+4 && bx<r.right-4 && !t.bounced[c]){
            t.bounced[c]=1;
            t.vy=-t.vy*REST; t.vx+=(Math.random()-0.5)*140; t.vr=(Math.random()-0.5)*260;
            t.y=r.top-t.s;
            cc.el.classList.remove('fx-bump'); void cc.el.offsetWidth;
            cc.el.classList.add('fx-bump');
            break;
          }
        }
      }
      if(t.y>innerHeight+80){ t.el.remove(); live.splice(i,1); continue; }
      t.el.style.transform='translate('+t.x.toFixed(1)+'px,'+t.y.toFixed(1)+'px) rotate('+t.rot.toFixed(1)+'deg)';
    }
    requestAnimationFrame(frame);
  }
  refreshColliders();
  addEventListener('resize', refreshColliders);
  requestAnimationFrame(frame);
  setTimeout(spawn, 1400);
  setInterval(spawn, 3600);
})();
</script>
</body>
</html>
