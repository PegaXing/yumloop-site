<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumloop</title>
<meta name="description" content="Yumloop — games coming soon.">
<meta name="theme-color" content="#140FD7">
<link rel="canonical" href="https://yumloop.net/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yumloop">
<meta property="og:title" content="Yumloop">
<meta property="og:description" content="Games coming soon.">
<meta property="og:url" content="https://yumloop.net/">
<meta property="og:image" content="https://yumloop.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#140FD7;
    color:#fff;
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(24px,6vw,64px);
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  img{width:min(620px,78vw); height:auto; display:block}
  p{
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(11px,1.5vw,13px); font-weight:500;
    letter-spacing:.24em; text-transform:uppercase;
    color:rgba(255,255,255,.78);
    margin:clamp(26px,4vw,40px) 0 clamp(44px,6vw,64px);
  }
  .actions{display:flex}
  .actions a{
    display:inline-block; text-decoration:none;
    font-weight:600; font-size:15.5px; letter-spacing:.01em;
    padding:15px 34px; border:1px solid #fff;
    transition:background .15s linear, color .15s linear;
  }
  .actions a.solid{background:#fff; color:#140FD7}
  .actions a.solid:hover{background:transparent; color:#fff}
  .actions a.line{background:transparent; color:#fff; border-left:0}
  .actions a.line:hover{background:#fff; color:#140FD7}
  .actions a:focus-visible{outline:2px solid #fff; outline-offset:4px}
  @media (max-width:520px){
    .actions{flex-direction:column; width:100%; max-width:320px}
    .actions a.line{border-left:1px solid #fff; border-top:0}
  }

  .foot{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
    padding:24px var(--gutter, clamp(24px,6vw,64px));
  }
  .foot a{
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.5); text-decoration:none;
  }
  .foot a:hover,.foot a:focus-visible{color:#fff}
</style>
</head>
<body>
  <img src="yumloop-logo.png" alt="Yumloop" width="1400" height="196">
  <p>Games coming soon</p>
  <div class="actions">
    <a class="solid" href="mailto:yoni@yumloop.net?subject=Hello%20Yumloop">Contact</a>
    <a class="line" href="mailto:yoni@yumloop.net?subject=Launch%20note&amp;body=Let%20me%20know%20when%20there's%20something%20to%20play.">Launch note</a>
  </div>

  <nav class="foot" aria-label="Site">
    <a href="/privacy.html">Privacy</a>
    <a href="/support.html">Support</a>
  </nav>
</body>
</html>
