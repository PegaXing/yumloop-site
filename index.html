<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumloop</title>
<meta name="description" content="Yumloop — an independent studio of one. Sightline, a logic puzzle, coming soon to iOS.">
<meta name="theme-color" content="#140FD7">
<link rel="canonical" href="https://yumloop.net/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yumloop">
<meta property="og:title" content="Yumloop">
<meta property="og:description" content="Sightline, a logic puzzle, coming soon to iOS. And more games coming soon.">
<meta property="og:url" content="https://yumloop.net/">
<meta property="og:image" content="https://yumloop.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#140FD7;
    --lilac:#BFA6FD;
    --sans:Archivo,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100svh;
    background:var(--blue); color:#fff;
    font-family:var(--sans);
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; height:auto; display:block}
  :focus-visible{outline:2px solid #fff; outline-offset:4px}

  .stage{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(36px,6vw,72px) clamp(20px,5vw,64px) clamp(24px,4vw,48px);
  }

  .brand{width:min(360px,56vw); margin-bottom:clamp(38px,6vw,72px)}

  /* --- Sightline block --- */
  .game{
    display:grid; grid-template-columns:auto auto;
    align-items:center; justify-content:center;
    gap:clamp(30px,5vw,76px);
    width:100%;
  }
  .copy{text-align:left; max-width:440px}
  .copy .mark{width:min(420px,40vw)}
  .rule{height:1px; background:rgba(255,255,255,.38); border:0; margin:clamp(18px,2.4vw,30px) 0}
  .soon{
    margin:0; font-weight:600; text-transform:uppercase;
    font-size:clamp(16px,2vw,27px); letter-spacing:.15em; line-height:1.32;
  }
  .soon span{color:var(--lilac); text-transform:none}
  .board{width:clamp(220px,27vw,330px)}

  @media (max-width:860px){
    .game{grid-template-columns:1fr; justify-items:center; gap:clamp(28px,6vw,44px)}
    .copy{text-align:center; max-width:none}
    /* keep the studio wordmark reading larger than the game's */
    .brand{width:min(360px,64vw); margin-bottom:clamp(46px,9vw,64px)}
    .copy .mark{width:min(290px,54vw); margin-inline:auto}
    .board{width:min(290px,62vw)}
  }

  .more{
    margin:clamp(34px,5vw,56px) 0 0;
    font-family:var(--mono); font-size:clamp(10px,1.1vw,12px); font-weight:500;
    letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.55);
  }

  /* --- actions --- */
  .actions{display:flex; margin-top:clamp(30px,4vw,44px)}
  .actions a{
    display:inline-block; text-decoration:none;
    font-weight:600; font-size:15.5px; letter-spacing:.01em;
    padding:15px 34px; border:1px solid #fff;
    transition:background .15s linear, color .15s linear;
  }
  .actions a.solid{background:#fff; color:var(--blue)}
  .actions a.solid:hover{background:transparent; color:#fff}
  .actions a.line{background:transparent; color:#fff; border-left:0}
  .actions a.line:hover{background:#fff; color:var(--blue)}
  @media (max-width:520px){
    .actions{flex-direction:column; width:100%; max-width:320px}
    .actions a.line{border-left:1px solid #fff; border-top:0}
  }

  /* --- footer --- */
  .foot{
    display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
    padding:0 clamp(20px,5vw,64px) 26px;
  }
  .foot a{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.5); text-decoration:none;
  }
  .foot a:hover,.foot a:focus-visible{color:#fff}
</style>
</head>
<body>

<main class="stage">
  <img class="brand" src="yumloop-logo.png" alt="Yumloop" width="1400" height="196">

  <section class="game" aria-label="Sightline">
    <div class="copy">
      <img class="mark" src="sightline-logo.png" alt="Sightline" width="1200" height="172">
      <hr class="rule">
      <p class="soon">Coming soon to <span>iOS</span></p>
    </div>
    <img class="board" src="sightline-board.png"
         alt="A Sightline puzzle board: a four-by-four grid with numbered clues down the left edge and coloured tiles marking blockers and directions."
         width="840" height="868">
  </section>

  <p class="more">And more games coming soon</p>

  <div class="actions">
    <a class="solid" href="mailto:yoni@yumloop.net?subject=Hello%20Yumloop">Contact</a>
    <a class="line" href="mailto:yoni@yumloop.net?subject=Launch%20note&amp;body=Let%20me%20know%20when%20Sightline%20is%20out.">Launch note</a>
  </div>
</main>

<nav class="foot" aria-label="Site">
  <a href="/privacy.html">Privacy</a>
  <a href="/support.html">Support</a>
</nav>

</body>
</html>
